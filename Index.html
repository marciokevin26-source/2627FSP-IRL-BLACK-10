<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Previewer Link & File HTML</title>
  <style>
    /* Styling Dasar */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #f4f6f8;
    }

    /* Header & Panel Kontrol */
    header {
      background-color: #ffffff;
      padding: 15px 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      z-index: 10;
    }

    h1 {
      font-size: 1.2rem;
      margin-bottom: 15px;
      color: #333;
    }

    .control-panel {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .input-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="url"], input[type="file"] {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    input[type="url"] {
      width: 250px;
    }

    button {
      padding: 8px 15px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    button:hover {
      background-color: #0056b3;
    }

    /* Area Tampilan Preview */
    main {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 1px solid #ccc;
      border-radius: 4px;
      background-color: #ffffff;
    }
  </style>
</head>
<body>

  <header>
    <h1>HTML & URL Viewer</h1>
    <div class="control-panel">
      <!-- Form Input Link -->
      <div class="input-group">
        <input type="url" id="urlInput" placeholder="Masukkan URL (misal: https://example.com)">
        <button onclick="loadURL()">Buka Link</button>
      </div>

      <!-- Form Input File HTML -->
      <div class="input-group">
        <input type="file" id="fileInput" accept=".html,.htm">
        <button onclick="loadFile()">Tampilkan File</button>
      </div>
    </div>
  </header>

  <!-- Container Preview -->
  <main>
    <iframe id="previewFrame" title="Preview Window"></iframe>
  </main>

  <script>
    // Fungsi untuk memuat URL ke dalam Iframe
    function loadURL() {
      const url = document.getElementById('urlInput').value.trim();
      const iframe = document.getElementById('previewFrame');

      if (!url) {
        alert('Harap masukkan URL yang valid!');
        return;
      }

      // Pastikan URL memiliki awalan http:// atau https://
      let formattedUrl = url;
      if (!/^https?:\/\//i.test(url)) {
        formattedUrl = 'https://' + url;
      }

      iframe.src = formattedUrl;
    }

    // Fungsi untuk memuat File HTML Lokal ke dalam Iframe
    function loadFile() {
      const fileInput = document.getElementById('fileInput');
      const iframe = document.getElementById('previewFrame');
      const file = fileInput.files[0];

      if (!file) {
        alert('Pilih file HTML terlebih dahulu!');
        return;
      }

      const reader = new FileReader();

      // Saat file selesai dibaca
      reader.onload = function(e) {
        const content = e.target.result;
        // Memasukkan isi file HTML langsung ke dokumen iframe
        iframe.srcdoc = content;
      };

      // Membaca file sebagai teks
      reader.readAsText(file);
    }
  </script>

</body>
</html>
