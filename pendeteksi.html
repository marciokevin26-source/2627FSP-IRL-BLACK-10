<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendeteksi Nominal Uang AI 💵</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; }
        h1 { color: #333; }
        video { width: 100%; max-width: 400px; border: 4px solid #4CAF50; border-radius: 12px; background-color: #000; }
        /* Elemen canvas ini disembunyikan, hanya dipakai di belakang layar untuk mengambil foto */
        canvas { display: none; } 
        button { padding: 12px 24px; font-size: 16px; margin: 15px; cursor: pointer; background-color: #4CAF50; color: white; border: none; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button:hover { background-color: #45a049; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        #hasil { font-size: 24px; font-weight: bold; margin-top: 20px; color: #2c3e50; min-height: 30px;}
    </style>
</head>
<body>

    <h1>Pendeteksi Uang AI 💵</h1>
    <p>Arahkan uang Rupiah ke kamera dengan jelas, lalu klik tombol deteksi.</p>

    <video id="kamera" autoplay playsinline></video>
    <!-- Canvas untuk menangkap frame dari video -->
    <canvas id="kanvasFoto"></canvas> 
    <br>
    
    <button id="tombolMulai">1. Nyalakan Kamera</button>
    <button id="tombolDeteksi" style="display:none;">2. Deteksi Uang Sekarang!</button>

    <div id="hasil">Kamera belum menyala...</div>

    <script>
        // --- ⚠️ PENTING: GANTI DENGAN API KEY ANDA ⚠️ ---
        // Dapatkan di: https://aistudio.google.com/app/apikey
        const GEMINI_API_KEY = 'MASUKKAN_API_KEY_GEMINI_ANDA_DI_SINI'; 
        
        const elemenKamera = document.getElementById('kamera');
        const kanvasFoto = document.getElementById('kanvasFoto');
        const contextKanvas = kanvasFoto.getContext('2d');
        const tombolMulai = document.getElementById('tombolMulai');
        const tombolDeteksi = document.getElementById('tombolDeteksi');
        const elemenHasil = document.getElementById('hasil');

        // Fungsi menyalakan kamera (Sama seperti sebelumnya)
        async function nyalakanKamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                elemenKamera.srcObject = stream;
                tombolMulai.style.display = 'none';
                tombolDeteksi.style.display = 'inline-block';
                elemenHasil.innerText = "Kamera aktif. Arahkan uang dan klik deteksi.";
            } catch (error) {
                console.error("Error kamera:", error);
                elemenHasil.innerText = "Gagal membuka kamera.";
            }
        }

        // Fungsi berbicara (Sama seperti sebelumnya)
        function bicara(teks) {
            if ('speechSynthesis' in window) {
                const ucapan = new SpeechSynthesisUtterance(teks);
                ucapan.lang = 'id-ID';
                window.speechSynthesis.speak(ucapan);
            }
        }

        // Fungsi mengambil gambar dari video
        function ambilFotoDariVideo() {
            // Set ukuran canvas sama dengan ukuran video asli
            kanvasFoto.width = elemenKamera.videoWidth;
            kanvasFoto.height = elemenKamera.videoHeight;
            // Gambar frame video saat ini ke canvas
            contextKanvas.drawImage(elemenKamera, 0, 0, kanvasFoto.width, kanvasFoto.height);
            // Ubah gambar di canvas menjadi format teks Base64 (JPEG)
            const dataUrl = kanvasFoto.toDataURL('image/jpeg', 0.8);
            // Buang awalan "data:image/jpeg;base64," agar tersisa data mentahnya saja
            return dataUrl.split(',')[1]; 
        }

        // Fungsi untuk mengirim gambar ke AI (Gemini API)
        async function deteksiUangAI() {
            if (GEMINI_API_KEY === 'MASUKKAN_API_KEY_GEMINI_ANDA_DI_SINI') {
                alert("Anda belum memasukkan API Key Gemini di dalam kode script!");
                return;
            }

            tombolDeteksi.disabled = true; // Matikan tombol sementara
            elemenHasil.innerText = "Memotret dan menganalisis dengan AI... ⏳";

            try {
                const base64Image = ambilFotoDariVideo();

                // URL Endpoint Google Gemini API (model gemini-1.5-flash cocok untuk gambar)
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
                
                // Menyiapkan pertanyaan (prompt) untuk AI
                const promptText = "Kamu adalah alat pendeteksi uang tunai Rupiah Indonesia untuk tunanetra. Lihat gambar ini. Jika ada uang kertas atau koin Rupiah Indonesia yang terlihat jelas, balas HANYA dengan angka nominalnya saja (contoh: 100000, 50000, 2000, 500). Jangan gunakan titik atau huruf. Jika tidak ada uang, atau gambar tidak jelas, balas dengan kata 'Tidak Terdeteksi'.";

                // Struktur data yang diminta oleh API Gemini
                const requestBody = {
                    contents: [{
                        parts: [
                            { text: promptText },
                            {
                                inline_data: {
                                    mime_type: "image/jpeg",
                                    data: base64Image
                                }
                            }
                        ]
                    }]
                };

                // Mengirim permintaan (Request) ke server Google
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                // Mengambil teks balasan dari AI
                let jawabanAI = data.candidates[0].content.parts[0].text.trim();
                
                // Memproses jawaban untuk diucapkan
                if (jawabanAI.toLowerCase().includes("tidak terdeteksi")) {
                    elemenHasil.innerText = "Uang tidak terdeteksi dengan jelas.";
                    bicara("Uang tidak terdeteksi. Silakan coba lagi.");
                } else if (!isNaN(jawabanAI)) {
                    // Jika balasannya angka (misal "100000")
                    // Format angka dengan titik agar mudah dibaca di layar (100.000)
                    let angkaBerformat = parseInt(jawabanAI).toLocaleString('id-ID'); 
                    elemenHasil.innerText = `Terdeteksi: Rp ${angkaBerformat}`;
                    bicara(`${jawabanAI} Rupiah`); // Berbicara langsung angkanya
                } else {
                     // Jaga-jaga jika AI menjawab selain angka
                    elemenHasil.innerText = "Hasil: " + jawabanAI;
                    bicara(jawabanAI);
                }

            } catch (error) {
                console.error("Error deteksi:", error);
                elemenHasil.innerText = "Terjadi kesalahan saat menghubungi AI.";
                bicara("Terjadi kesalahan jaringan.");
            } finally {
                tombolDeteksi.disabled = false; // Nyalakan tombol kembali
            }
        }

        tombolMulai.addEventListener('click', nyalakanKamera);
        tombolDeteksi.addEventListener('click', deteksiUangAI);
    </script>
</body>
</html>
